<!DOCTYPE html>
<html lang="bn"><link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, minimum-scale=1.0,
user-scalable=no, viewport-fit=cover">

<title>JAWRA MUSIC</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:pan-x pan-y;
  overscroll-behavior-x:none;
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

input{
  outline:none;
}

/* ================= SPLASH ================= */

#splash{
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999999;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:splashOut .8s ease forwards;
  animation-delay:2s;
}

#splash img{
  width:145px;
  height:145px;
  object-fit:cover;
  border-radius:50%;
  box-shadow:
    0 0 20px rgba(212,175,55,.4),
    0 0 55px rgba(212,175,55,.25);
  animation:splashPulse 1.2s infinite alternate;
}

@keyframes splashPulse{
  from{
    transform:scale(.94);
    opacity:.8;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

@keyframes splashOut{
  to{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
}

/* ================= APP ================= */

#app{
  display:block;
  min-height:100vh;
  padding-bottom:75px;
}

/* ================= HOME HEADER ================= */

.home-header{
  position:sticky;
  top:0;
  z-index:4000;
  min-height:74px;
  background:#050505;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid #181818;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
  white-space:nowrap;
}

/* Long search */

.home-search{
  flex:1;
  height:46px;
  display:flex;
  align-items:center;
  background:#151515;
  border:1px solid #333;
  border-radius:24px;
  overflow:hidden;
  min-width:0;
}

.home-search input{
  flex:1;
  width:100%;
  height:100%;
  min-width:0;
  border:0;
  background:transparent;
  color:#fff;
  padding:0 15px;
  font-size:16px;
}

.home-search input::placeholder{
  color:#aaa;
}

.home-search button{
  width:48px;
  height:100%;
  background:#222;
  color:#fff;
  font-size:20px;
}

.home-voice{
  width:43px;
  height:43px;
  flex:none;
  border-radius:50%;
  background:#181818;
  border:1px solid #383838;
  color:#fff;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.home-voice.listening{
  background:#d4af37;
  color:#000;
  animation:voicePulse .9s infinite alternate;
}

@keyframes voicePulse{
  from{transform:scale(1);}
  to{transform:scale(1.08);}
}

.home-demon{
  width:43px;
  height:43px;
  flex:none;
  border-radius:50%;
  background:#171717;
  border:1px solid #333;
  font-size:22px;
}

/* ================= FULL SEARCH OVERLAY (যেমন দ্বিতীয় পিকচারে আছে) ================= */

#fullSearchOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:#050505;
  z-index:99999;
  flex-direction:column;
  padding-bottom:80px;
}

.full-search-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:#050505;
  border-bottom:1px solid #181818;
}

.full-search-back{
  background:transparent;
  color:#fff;
  font-size:26px;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.full-search-bar{
  flex:1;
  height:46px;
  display:flex;
  align-items:center;
  background:#1f1f1f;
  border-radius:24px;
  overflow:hidden;
  padding:0 15px;
}

.full-search-bar input{
  flex:1;
  border:0;
  background:transparent;
  color:#fff;
  font-size:16px;
}

.full-search-mic{
  background:transparent;
  color:#fff;
  font-size:20px;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.search-history-list{
  flex:1;
  overflow-y:auto;
  padding:10px 0;
}

.search-history-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 20px;
  color:#ddd;
  font-size:15px;
  cursor:pointer;
}

.search-history-item:active{
  background:#151515;
}

.history-left{
  display:flex;
  align-items:center;
  gap:18px;
}

.history-left span{
  color:#aaa;
  font-size:18px;
}

.history-arrow{
  color:#aaa;
  font-size:18px;
}

/* ================= CATEGORIES ================= */

.categories{
  display:flex;
  gap:9px;
  padding:12px 14px;
  overflow-x:auto;
  scrollbar-width:none;
  background:#050505;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:none;
  padding:9px 17px;
  border-radius:20px;
  color:#ddd;
  background:#181818;
  border:1px solid #292929;
}

.category.active{
  background:#d4af37;
  color:#000;
  border-color:#d4af37;
  font-weight:bold;
}

/* ================= VIDEO CARDS ================= */

#homeResults{
  width:100%;
}

.video-card{
  width:100%;
  background:#080808;
  margin:0 0 17px;
  overflow:hidden;
}

.thumb-wrap{
  width:100%;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  background:#111;
}

.thumb-wrap img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.duration{
  position:absolute;
  right:8px;
  bottom:8px;
  padding:4px 7px;
  background:rgba(0,0,0,.75);
  border-radius:5px;
  font-size:12px;
}

.video-info{
  display:flex;
  gap:11px;
  padding:11px 14px 12px;
}

.channel-avatar{
  width:43px;
  height:43px;
  flex:none;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.video-text{
  min-width:0;
  flex:1;
}

.video-title{
  font-size:16px;
  line-height:1.35;
  font-weight:600;
  color:#eee;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.video-meta{
  margin-top:7px;
  color:#999;
  font-size:13px;
}

/* ================= LOADER ================= */

.loader{
  text-align:center;
  padding:25px;
  color:#aaa;
}

.error{
  margin:20px;
  padding:20px;
  border:1px solid #492020;
  border-radius:12px;
  color:#ffb0b0;
  background:#180909;
}

/* ================= PLAYER PAGE ================= */

#playerPage{
  display:none;
  min-height:100vh;
  background:#050505;
  padding-bottom:30px;
}

.player-header{
  position:sticky;
  top:0;
  z-index:7000;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#050505;
  border-bottom:1px solid #252525;
}

.player-left{
  display:flex;
  align-items:center;
  min-width:0;
}

.player-back{
  width:50px;
  height:52px;
  background:transparent;
  color:#fff;
  font-size:36px;
}

.player-name{
  font-weight:800;
  white-space:nowrap;
}

.player-actions{
  display:flex;
  align-items:center;
  gap:4px;
}

.player-actions button{
  width:43px;
  height:43px;
  background:transparent;
  color:#fff;
  font-size:20px;
}

.player-demon-btn{
  font-size:22px!important;
}

/* Player search panel */

#playerSearchPanel{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:52px;
  padding:10px 12px;
  background:#080808;
  border-bottom:1px solid #333;
  z-index:8000;
}

.player-search-box{
  height:46px;
  display:flex;
  background:#171717;
  border:1px solid #3a3a3a;
  border-radius:24px;
  overflow:hidden;
}

.player-search-box input{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  color:#fff;
  padding:0 15px;
}

.player-search-box button{
  width:50px;
  background:#d4af37;
  color:#000;
  font-size:20px;
}

/* ================= PLAYER ================= */

#fullFrameHost{
  width:100%;
  background:#000;
  position:sticky;
  top:52px;
  z-index:5000;
  border:2px solid #d4af37;
  border-radius:0;
  overflow:hidden;
  box-shadow:0 7px 28px rgba(212,175,55,.2);
  display:block;
}

#youtubeFrame{
  width:100%;
  aspect-ratio:16/9;
  height:auto;
  display:block;
  border:0;
  background:#000;
}

/* Landscape related */

#landscapeRelated{
  display:none;
  width:29%;
  height:100%;
  overflow-y:auto;
  background:#090909;
  flex:none;
}

.landscape-title{
  padding:12px;
  font-weight:bold;
  border-bottom:1px solid #252525;
}

.landscape-card{
  padding:7px;
  display:flex;
  gap:7px;
  border-bottom:1px solid #222;
}

.landscape-card img{
  width:105px;
  height:60px;
  object-fit:cover;
  border-radius:4px;
  flex:none;
}

.landscape-card div{
  font-size:12px;
  line-height:1.3;
}

/* fullscreen */

#fullFrameHost:fullscreen,
#fullFrameHost:-webkit-full-screen{
  position:fixed;
  inset:0;
  z-index:999999;
  width:100vw;
  height:100vh;
  border:0;
  border-radius:0;
  box-shadow:none;
  display:flex;
  flex-direction:row;
  background:#000;
}

#fullFrameHost:fullscreen #youtubeFrame,
#fullFrameHost:-webkit-full-screen #youtubeFrame{
  width:71%;
  height:100%;
  aspect-ratio:auto;
  object-fit:contain;
  flex-shrink:0;
}

#fullFrameHost:fullscreen #landscapeRelated,
#fullFrameHost:-webkit-full-screen #landscapeRelated{
  display:block;
}

/* ================= RELATED ================= */

.related{
  padding:18px 0 40px;
}

.related-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px 12px;
}

.related-title{
  font-size:19px;
  font-weight:800;
}

.related-clear{
  background:#181818;
  border:1px solid #333;
  color:#ddd;
  padding:7px 12px;
  border-radius:16px;
  font-size:12px;
}

.related .video-card{
  margin-bottom:13px;
}

.related .thumb-wrap{
  aspect-ratio:16/9;
}

.related .video-info{
  padding-top:9px;
}

/* ================= MINI PLAYER (আপনার প্রথম পিকের মতো ডিজাইন) ================= */

#miniPlayer{
  display:none;
  position:fixed;
  left:10px;
  right:10px;
  bottom:68px;
  height:75px;
  z-index:9500;
  background:#141414;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #222;
  box-shadow:0 8px 25px rgba(0,0,0,0.8);
  display:flex;
  align-items:center;
  padding:0 10px;
  gap:12px;
}

#miniThumb{
  width:90px;
  height:52px;
  object-fit:cover;
  border-radius:6px;
  flex:none;
  background:#000;
}

.mini-info{
  flex:1;
  min-width:0;
}

#miniTitle{
  color:#fff;
  font-size:13px;
  font-weight:600;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.mini-controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
}

.mini-button{
  background:transparent;
  color:#fff;
  font-size:22px;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#playerPage.mini-hidden{
  display:block!important;
  position:fixed!important;
  left:-120vw!important;
  top:0!important;
  width:100vw!important;
  height:1px!important;
  overflow:hidden!important;
  opacity:0!important;
  pointer-events:none!important;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:64px;
  background:rgba(8,8,8,.97);
  border-top:1px solid #292929;
  z-index:9000;
  display:flex;
  align-items:center;
  justify-content:space-around;
}

.nav-btn{
  flex:1;
  height:100%;
  color:#aaa;
  background:transparent;
  font-size:11px;
}

.nav-btn span{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:#fff;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

  .home-header{
    padding:10px 10px;
    gap:7px;
  }

  .logo{
    display:none;
  }

  .home-search{
    height:47px;
  }

  .home-voice,
  .home-demon{
    width:42px;
    height:42px;
  }
}
</style>
</head>

  "রোজ সকালে স্কুলে যাও বান্ধবীদের নিয়ে",
  "ডিজে",
  "ডান্স",
  "প্রেম যে বোবা প্রেম কেন কালা তাই প্রেমে এত জ্বালা",
  "টেজের ডান্স",
  "dj2026",
  "চিকু বান্টি"
];

function hasApiKey(){
  return API_KEY && API_KEY !== "YOUR_YOUTUBE_API_KEY_HERE";
}

function escapeHTML(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function youtubeSearch(query, maxResults=10, pageToken=""){
  if(!hasApiKey()){
    throw new Error("YouTube API key বসানো হয়নি।");
  }
  let url = API_URL + "?part=snippet&type=video&maxResults=" + maxResults + "&q=" + encodeURIComponent(query) + "&regionCode=BD&safeSearch=moderate&key=" + encodeURIComponent(API_KEY);
  if(pageToken){
    url += "&pageToken=" + encodeURIComponent(pageToken);
  }
  const response = await fetch(url);
  const data = await response.json();
  if(!response.ok){
    throw new Error(data?.error?.message || "YouTube API error");
  }
  return data;
}

function shuffle(array){
  const arr = [...(array || [])];
  for(let i=arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function videoCardHTML(item){
  const id = item.id?.videoId || item.id;
  const snippet = item.snippet || {};
  if(!id) return "";
  const title = escapeHTML(snippet.title || "Untitled");
  const channel = escapeHTML(snippet.channelTitle || "YouTube");
  const thumb = snippet.thumbnails?.high?.url || snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url || "";
  const avatar = snippet.thumbnails?.default?.url || thumb;

  return `
    <article class="video-card" data-video-id="${escapeHTML(id)}" data-title="${title}" data-thumb="${escapeHTML(thumb)}">
      <div class="thumb-wrap">
        <img src="${escapeHTML(thumb)}" alt="${title}" loading="lazy">
      </div>
      <div class="video-info">
        <img class="channel-avatar" src="${escapeHTML(avatar)}" alt="" loading="lazy">
        <div class="video-text">
          <div class="video-title">${title}</div>
          <div class="video-meta">${channel}</div>
        </div>
      </div>
    </article>
  `;
}

function renderHome(items, append=false){
  if(!append) homeResults.innerHTML="";
  const valid = (items || []).filter(item => item.id?.videoId);
  homeResults.insertAdjacentHTML("beforeend", valid.map(videoCardHTML).join(""));
}

async function searchHome(query, append=false){
  query = String(query || "").trim();
  if(!query) return;
  if(homeLoading) return;

  if(!append){
    homeNextPageToken="";
    homeResults.innerHTML = `<div class="loader">Searching...</div>`;
  }

  homeLoading=true;
  homeLoader.textContent = "Loading...";

  try{
    const data = await youtubeSearch(query, 10, append ? homeNextPageToken : "");
    if(!append) homeResults.innerHTML="";
    renderHome(data.items || [], true);
    homeCurrentQuery = query;
    homeNextPageToken = data.nextPageToken || "";
  }catch(error){
    if(!append){
      homeResults.innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
    }
  }finally{
    homeLoading=false;
    homeLoader.textContent = homeNextPageToken ? "Scroll for more..." : "";
  }
}

/* Full Search Overlay Logic */
function openFullSearch(){
  renderSearchHistory();
  fullSearchOverlay.style.display = "flex";
  setTimeout(() => { fullSearchInput.focus(); }, 100);
}

function closeFullSearch(){
  fullSearchOverlay.style.display = "none";
}

function renderSearchHistory(){
  searchHistoryList.innerHTML = defaultHistory.map(text => `
    <div class="search-history-item" data-query="${escapeHTML(text)}">
      <div class="history-left">
        <span>🕒</span>
        <div>${escapeHTML(text)}</div>
      </div>
      <div class="history-arrow">↗</div>
    </div>
  `).join("");
}

searchHistoryList.addEventListener("click", e => {
  const item = e.target.closest(".search-history-item");
  if(item){
    const q = item.dataset.query;
    fullSearchInput.value = q;
    closeFullSearch();
    homeSearchInput.value = q;
    searchHome(q, false);
  }
});

fullSearchBack.addEventListener("click", closeFullSearch);

fullSearchInput.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    const q = fullSearchInput.value.trim();
    if(q){
      closeFullSearch();
      homeSearchInput.value = q;
      searchHome(q, false);
    }
  }
});

/* Home Search Box & Nav Search Click */
homeSearchTrigger.addEventListener("click", openFullSearch);
navSearch.addEventListener("click", openFullSearch);

/* Voice Search */
function startVoiceSearch(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert("তোমার browser-এ Voice Search support নেই।");
    return;
  }
  if(recognition){
    try{ recognition.stop(); }catch(e){}
    recognition = null;
    homeVoiceBtn.classList.remove("listening");
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = "bn-BD";
  recognition.onstart = () => { homeVoiceBtn.classList.add("listening"); };
  recognition.onresult = async event => {
    const text = event.results?.[0]?.[0]?.transcript || "";
    if(text){
      closeFullSearch();
      homeSearchInput.value = text;
      await searchHome(text, false);
    }
  };
  recognition.onend = () => { homeVoiceBtn.classList.remove("listening"); recognition = null; };
  try{ recognition.start(); }catch(error){ console.log(error); }
}

homeVoiceBtn.addEventListener("click", startVoiceSearch);
fullSearchMic.addEventListener("click", startVoiceSearch);

/* Open Player */
function openPlayer(videoId, title, thumb){
  if(!videoId) return;
  currentVideoId = videoId;
  currentVideoTitle = title || "JAWRA MUSIC";
  currentVideoThumb = thumb || "";
  playbackActive = true;

  if(youtubeFrame.dataset.videoId !== videoId){
    youtubeFrame.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId) + "?autoplay=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=" + encodeURIComponent(location.origin);
    youtubeFrame.dataset.videoId = videoId;
  }

  playerPage.classList.remove("mini-hidden");
  playerPage.style.display = "block";
  app.style.display = "none";
  miniPlayer.style.display = "none";
  isMiniMode = false;
  playerSearchPanel.style.display = "none";
}

/* Mini Mode */
function enterMiniMode(){
  if(!currentVideoId) return;
  playbackActive = true;
  isMiniMode = true;

  playerPage.classList.add("mini-hidden");
  app.style.display = "block";
  miniPlayer.style.display = "flex";
  miniTitle.textContent = currentVideoTitle;
  miniThumb.src = currentVideoThumb || "https://i.ibb.co.com/r2cGS8H4/1000012185.jpg";
}

function reopenMiniPlayer(){
  if(!currentVideoId) return;
  playerPage.classList.remove("mini-hidden");
  playerPage.style.display = "block";
  app.style.display = "none";
  miniPlayer.style.display = "none";
  isMiniMode = false;
}

function closePlayback(){
  playbackActive = false;
  isMiniMode = false;
  try{ youtubeFrame.src=""; }catch(e){}
  youtubeFrame.dataset.videoId="";
  currentVideoId="";
  currentVideoTitle="";
  currentVideoThumb="";

  playerPage.classList.remove("mini-hidden");
  playerPage.style.display = "none";
  miniPlayer.style.display = "none";
  app.style.display = "block";
}

/* Demon Button (😈) & Search Bar & Voice actions */
homeDemon.addEventListener("click", () => {
  if(currentVideoId) enterMiniMode();
});

playerDemonBtn.addEventListener("click", () => {
  if(currentVideoId) enterMiniMode();
});

/* Event Delegation for Cards */
document.addEventListener("click", event => {
  const card = event.target.closest(".video-card");
  if(card){
    openPlayer(card.dataset.videoId, card.dataset.title, card.dataset.thumb);
    return;
  }
});

playerBack.addEventListener("click", () => {
  if(isMiniMode){
    reopenMiniPlayer();
    return;
  }
  closePlayback();
});

miniOpen.addEventListener("click", reopenMiniPlayer);
miniClose.addEventListener("click", closePlayback);

navHome.addEventListener("click", () => {
  playerPage.style.display = "none";
  app.style.display = "block";
  playerPage.classList.remove("mini-hidden");
});

navPlayer.addEventListener("click", () => {
  if(currentVideoId){
    playerPage.classList.remove("mini-hidden");
    playerPage.style.display = "block";
    app.style.display = "none";
    miniPlayer.style.display = "none";
    isMiniMode = false;
  }
});

/* Initial Start */
setTimeout(() => { splash.style.display = "none"; }, 3000);

if(hasApiKey()){
  searchHome("trending music", false);
}else{
  homeResults.innerHTML = `<div class="error">YouTube API key বসাও।</div>`;
  homeLoader.textContent="";
}
